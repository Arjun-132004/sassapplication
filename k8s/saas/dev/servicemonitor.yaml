apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sassapplication
  namespace: storefront-devsaas
  labels:
    app.kubernetes.io/name: sassapplication
    app.kubernetes.io/managed-by: deepagent
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sassapplication
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
